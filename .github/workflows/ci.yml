name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m build
      - run: python scripts/scan_secrets.py
      - run: python examples/generate_synthetic.py
      - run: engineering-calibrate data/synthetic.csv --output ci-report
      - name: Companion integration
        run: |
          python -m pip install 'git+https://github.com/grenli415/plate-heat-exchanger-calculator.git@v0.1.0'
          python -m pytest -q tests/test_calibration.py::test_companion_integration
